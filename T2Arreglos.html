<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sonicse — Gestión de Arreglos</title>
    <link rel="stylesheet" href="T3Arreglos.css">
</head>
<body>
 
    <header>
        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div class="ring ring-3"></div>
        <div class="brand">
            <span class="brand-sonic">Sonic</span><span class="brand-se">se</span>
        </div>
        <p class="brand-sub">Gestión de Arreglos de Edades</p>
    </header>
 
    <main>
        <div class="input-area">
            <input type="text" id="txtEdad" placeholder="Ingresa una edad" />
            <button onclick="agregarEdad()">Agregar</button>
        </div>
 
        <div class="tablas">
            <div class="lado">
                <h2>Arreglo Izquierdo</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Valor</th>
                            <th>Eliminar</th>
                            <th>Mover →</th>
                        </tr>
                    </thead>
                    <tbody id="tablaIzquierda"></tbody>
                </table>
            </div>
 
            <div class="lado">
                <h2>Arreglo Derecho</h2>
                <table>
                    <thead>
                        <tr>
                            <th>← Mover</th>
                            <th>Valor</th>
                            <th>Eliminar</th>
                        </tr>
                    </thead>
                    <tbody id="tablaDerecha"></tbody>
                </table>
            </div>
        </div>
    </main>
    <script src="T1Arreglos.js"></script>
</body>
</html>
